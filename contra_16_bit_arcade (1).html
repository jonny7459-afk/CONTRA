<script>
/**
 * CONTRA 16-BIT ARCADE
 * Complete Single-File Implementation with Web Audio API, Canvas 2D Graphics Engine,
 * Parallax Backgrounds, Flying Falcon Pods, Weapon Switching, Boss Stage, and PWA Support.
 */

// --- AUDIO SYNTHESIZER ---
const AudioEngine = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },
    playLaser() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    },
    playSpread() {
        if (!this.ctx) return;
        for(let i = 0; i < 3; i++) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(400 + (i * 150), this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        }
    },
    playExplosion() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, this.ctx.currentTime);
        filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
    },
    playPowerup() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }
};

// --- GAME CORE ENGINE ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const CANVAS_WIDTH = 480;
const CANVAS_HEIGHT = 270;
const GRAVITY = 0.45;

const KEYS = {
    up: false, down: false, left: false, right: false,
    shoot: false, jump: false, shootPressed: false, jumpPressed: false
};

// Controls Event Listeners
window.addEventListener('keydown', e => {
    AudioEngine.init();
    if(e.code === 'KeyW' || e.code === 'ArrowUp') KEYS.up = true;
    if(e.code === 'KeyS' || e.code === 'ArrowDown') KEYS.down = true;
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') KEYS.left = true;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') KEYS.right = true;
    if(e.code === 'KeyJ' || e.code === 'KeyZ') {
        if(!KEYS.shoot) KEYS.shootPressed = true;
        KEYS.shoot = true;
    }
    if(e.code === 'KeyK' || e.code === 'KeyX') {
        if(!KEYS.jump) KEYS.jumpPressed = true;
        KEYS.jump = true;
    }
});

window.addEventListener('keyup', e => {
    if(e.code === 'KeyW' || e.code === 'ArrowUp') KEYS.up = false;
    if(e.code === 'KeyS' || e.code === 'ArrowDown') KEYS.down = false;
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') KEYS.left = false;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') KEYS.right = false;
    if(e.code === 'KeyJ' || e.code === 'KeyZ') KEYS.shoot = false;
    if(e.code === 'KeyK' || e.code === 'KeyX') KEYS.jump = false;
});

// Mobile Touch Attachments
function bindTouch(id, keyProp) {
    const el = document.getElementById(id);
    if (!el) return;
    const start = (e) => {
        e.preventDefault();
        AudioEngine.init();
        if(keyProp === 'shoot' && !KEYS.shoot) KEYS.shootPressed = true;
        if(keyProp === 'jump' && !KEYS.jump) KEYS.jumpPressed = true;
        KEYS[keyProp] = true;
    };
    const end = (e) => {
        e.preventDefault();
        KEYS[keyProp] = false;
    };
    el.addEventListener('touchstart', start);
    el.addEventListener('touchend', end);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
}
bindTouch('btn-up', 'up');
bindTouch('btn-down', 'down');
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-shoot', 'shoot');
bindTouch('btn-jump', 'jump');

// --- LEVEL & WORLD DEFINITION ---
const LEVEL_LENGTH = 2400;
const platforms = [
    { x: 0, y: 220, w: 600, h: 50 },
    { x: 200, y: 160, w: 120, h: 12 },
    { x: 380, y: 140, w: 140, h: 12 },
    { x: 650, y: 220, w: 500, h: 50 },
    { x: 720, y: 170, w: 100, h: 12 },
    { x: 880, y: 130, w: 120, h: 12 },
    { x: 1200, y: 220, w: 1200, h: 50 },
    { x: 1300, y: 160, w: 150, h: 12 },
    { x: 1500, y: 120, w: 180, h: 12 },
    { x: 1750, y: 170, w: 140, h: 12 }
];

// --- GAME STATE VARIABLES ---
let cameraX = 0;
let score = 0;
let lives = 3;
let gameState = 'PLAYING'; // PLAYING, GAMEOVER, VICTORY

// --- PLAYER ENGINE ---
const player = {
    x: 50,
    y: 100,
    w: 20,
    h: 36,
    vx: 0,
    vy: 0,
    speed: 2.2,
    jumpPower: -8.5,
    grounded: false,
    facing: 1, // 1: Right, -1: Left
    weapon: 'P', // P: Pistol, M: Machine Gun, S: Spread, L: Laser, F: Flame
    shootTimer: 0,
    invulnerable: 0,
    animFrame: 0,
    animTimer: 0,
    isCrouching: false,

    reset() {
        this.x = cameraX + 30;
        this.y = 50;
        this.vx = 0;
        this.vy = 0;
        this.weapon = 'P';
        this.invulnerable = 120;
    },

    update() {
        if(this.invulnerable > 0) this.invulnerable--;

        // Horizontal Movement
        this.isCrouching = KEYS.down && this.grounded;
        if (!this.isCrouching) {
            if (KEYS.left) {
                this.vx = -this.speed;
                this.facing = -1;
            } else if (KEYS.right) {
                this.vx = this.speed;
                this.facing = 1;
            } else {
                this.vx = 0;
            }
        } else {
            this.vx = 0;
        }

        // Jump Logic
        if (KEYS.jumpPressed && this.grounded) {
            this.vy = this.jumpPower;
            this.grounded = false;
        }

        // Apply Gravity
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        // Camera Constraint
        if (this.x < cameraX) this.x = cameraX;

        // Platform Collisions
        this.grounded = false;
        for (let p of platforms) {
            if (this.x + this.w > p.x && this.x < p.x + p.w) {
                if (this.y + this.h >= p.y && this.y + this.h - this.vy <= p.y + 10 && this.vy >= 0) {
                    this.grounded = true;
                    this.vy = 0;
                    this.y = p.y - this.h;
                }
            }
        }

        // Pitfall Death
        if (this.y > CANVAS_HEIGHT + 50) {
            this.hit();
        }

        // Shooting Logic
        if (this.shootTimer > 0) this.shootTimer--;
        
        const canShoot = (this.weapon === 'M' || this.weapon === 'F' || this.weapon === 'L') ? KEYS.shoot : KEYS.shootPressed;
        
        if (canShoot && this.shootTimer <= 0) {
            this.fireWeapon();
        }

        // Dynamic Camera Lock
        if (this.x - cameraX > CANVAS_WIDTH * 0.45 && cameraX < LEVEL_LENGTH - CANVAS_WIDTH) {
            cameraX = this.x - CANVAS_WIDTH * 0.45;
        }
    },

    fireWeapon() {
        let dirX = this.facing;
        let dirY = 0;

        if (KEYS.up) dirY = -1;
        if (KEYS.down && !this.grounded) dirY = 1;
        if (KEYS.up && (KEYS.left || KEYS.right)) dirY = -0.7;

        let spawnX = this.x + (this.facing === 1 ? this.w : 0);
        let spawnY = this.y + (this.isCrouching ? 24 : 12);

        if (this.weapon === 'P') {
            bullets.push(new Bullet(spawnX, spawnY, dirX * 6, dirY * 6, 'P'));
            this.shootTimer = 12;
            AudioEngine.playLaser();
        } else if (this.weapon === 'M') {
            bullets.push(new Bullet(spawnX, spawnY, dirX * 7.5, (dirY + (Math.random()*0.1 - 0.05)) * 7.5, 'M'));
            this.shootTimer = 6;
            AudioEngine.playLaser();
        } else if (this.weapon === 'S') {
            const spreadAngles = [-0.25, -0.12, 0, 0.12, 0.25];
            spreadAngles.forEach(ang => {
                let vx = dirX * Math.cos(ang) - dirY * Math.sin(ang);
                let vy = dirX * Math.sin(ang) + dirY * Math.cos(ang);
                bullets.push(new Bullet(spawnX, spawnY, vx * 5.5, vy * 5.5, 'S'));
            });
            this.shootTimer = 18;
            AudioEngine.playSpread();
        } else if (this.weapon === 'L') {
            bullets.push(new Bullet(spawnX, spawnY, dirX * 10, dirY * 10, 'L'));
            this.shootTimer = 10;
            AudioEngine.playLaser();
        } else if (this.weapon === 'F') {
            bullets.push(new Bullet(spawnX, spawnY, dirX * 4, dirY * 4, 'F'));
            this.shootTimer = 8;
            AudioEngine.playLaser();
        }
    },

    hit() {
        if (this.invulnerable > 0) return;
        lives--;
        createExplosion(this.x + this.w/2, this.y + this.h/2, '#e63946', 20);
        AudioEngine.playExplosion();
        if (lives <= 0) {
            gameState = 'GAMEOVER';
        } else {
            this.reset();
        }
    },

    draw() {
        if (this.invulnerable % 4 >= 2) return; // Flicker effect on hit

        ctx.save();
        ctx.translate(this.x - cameraX, this.y);

        // Body Rendering (Pixel Art Construction)
        ctx.fillStyle = '#457b9d'; // Pants
        if (this.isCrouching) {
            ctx.fillRect(0, 20, 22, 16);
            ctx.fillStyle = '#e63946'; // Vest
            ctx.fillRect(2, 12, 18, 10);
            ctx.fillStyle = '#ffb703'; // Head
            ctx.fillRect(6, 4, 10, 8);
        } else {
            ctx.fillRect(4, 20, 12, 16);
            ctx.fillStyle = '#e63946'; // Red Tactical Vest
            ctx.fillRect(2, 8, 16, 12);
            ctx.fillStyle = '#ffb703'; // Skin Head
            ctx.fillRect(4, 0, 12, 8);
            // Red Bandana
            ctx.fillStyle = '#e63946';
            ctx.fillRect(2, 1, 14, 3);
        }

        // Gun Visual Overlay
        ctx.fillStyle = '#d8f3dc';
        let gunLength = 14;
        let gunY = this.isCrouching ? 14 : 10;
        if(KEYS.up) {
            ctx.fillRect(this.facing === 1 ? 12 : 2, -6, 4, gunLength);
        } else {
            ctx.fillRect(this.facing === 1 ? 10 : -4, gunY, gunLength, 4);
        }

        ctx.restore();
    }
};

// --- BULLETS & PROJECTILES ---
const bullets = [];
class Bullet {
    constructor(x, y, vx, vy, type) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.type = type;
        this.life = 100;
        this.radius = type === 'S' ? 4 : (type === 'L' ? 6 : 3);
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;

        if (this.type === 'F') {
            this.vx *= 1.02;
            this.radius += 0.2;
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);

        if (this.type === 'P') {
            ctx.fillStyle = '#ffb703';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.type === 'M') {
            ctx.fillStyle = '#fff';
            ctx.fillRect(-3, -2, 6, 4);
        } else if (this.type === 'S') {
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.type === 'L') {
            ctx.strokeStyle = '#a8dadc';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-this.vx * 2, -this.vy * 2);
            ctx.stroke();
        } else if (this.type === 'F') {
            ctx.fillStyle = `rgba(230, 57, 70, ${this.life / 100})`;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }
}

// --- ENEMIES SYSTEM ---
const enemies = [];
class Enemy {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.w = 20;
        this.h = 32;
        this.type = type; // 'runner', 'turret'
        this.hp = type === 'turret' ? 6 : 1;
        this.vx = type === 'runner' ? -1.5 : 0;
        this.shootTimer = 0;
    }

    update() {
        if (this.type === 'runner') {
            this.x += this.vx;
            // Turn around on level boundaries or random
            if (Math.random() < 0.005) this.vx *= -1;
        } else if (this.type === 'turret') {
            this.shootTimer++;
            if (this.shootTimer > 90) {
                this.shootTimer = 0;
                let angle = Math.atan2(player.y - this.y, player.x - this.x);
                enemyBullets.push({
                    x: this.x,
                    y: this.y,
                    vx: Math.cos(angle) * 3,
                    vy: Math.sin(angle) * 3
                });
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);

        if (this.type === 'runner') {
            ctx.fillStyle = '#1d3557';
            ctx.fillRect(0, 0, this.w, this.h);
            ctx.fillStyle = '#ff4d6d'; // Enemy helmet
            ctx.fillRect(2, 2, 16, 8);
        } else if (this.type === 'turret') {
            ctx.fillStyle = '#6c757d';
            ctx.beginPath();
            ctx.arc(10, 10, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.fillRect(4, 8, 12, 4);
        }

        ctx.restore();
    }
}

// Enemy Projectiles
const enemyBullets = [];

// Populate Level Enemies
function initEnemies() {
    enemies.length = 0;
    enemies.push(new Enemy(400, 188, 'runner'));
    enemies.push(new Enemy(480, 108, 'turret'));
    enemies.push(new Enemy(750, 138, 'turret'));
    enemies.push(new Enemy(900, 190, 'runner'));
    enemies.push(new Enemy(1050, 190, 'runner'));
    enemies.push(new Enemy(1350, 128, 'turret'));
    enemies.push(new Enemy(1600, 190, 'runner'));
}
initEnemies();

// --- FLYING FALCON PODS & POWERUPS ---
const falconPods = [];
const powerups = [];

class FalconPod {
    constructor(x, y, weaponType) {
        this.x = x;
        this.y = y;
        this.baseY = y;
        this.w = 24;
        this.h = 16;
        this.weaponType = weaponType; // M, S, L, F
        this.time = 0;
    }

    update() {
        this.x += 1.2;
        this.time += 0.05;
        this.y = this.baseY + Math.sin(this.time) * 20;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);
        ctx.fillStyle = '#ffb703';
        ctx.beginPath();
        ctx.ellipse(12, 8, 12, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e63946';
        ctx.fillRect(8, 4, 8, 8);
        ctx.restore();
    }
}

class Powerup {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.w = 16;
        this.h = 16;
        this.type = type;
        this.vy = -2;
    }

    update() {
        this.vy += GRAVITY * 0.5;
        this.y += this.vy;

        for (let p of platforms) {
            if (this.x + this.w > p.x && this.x < p.x + p.w) {
                if (this.y + this.h >= p.y && this.y + this.h - this.vy <= p.y + 10) {
                    this.y = p.y - this.h;
                    this.vy = 0;
                }
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);
        ctx.fillStyle = '#e63946';
        ctx.fillRect(0, 0, this.w, this.h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Courier';
        ctx.fillText(this.type, 4, 13);
        ctx.restore();
    }
}

// Spawn Falcon Pods along level
falconPods.push(new FalconPod(300, 80, 'M'));
falconPods.push(new FalconPod(700, 70, 'S'));
falconPods.push(new FalconPod(1200, 80, 'L'));
falconPods.push(new FalconPod(1600, 70, 'F'));

// --- ALIEN CORE BOSS ---
const boss = {
    x: 2150,
    y: 90,
    w: 80,
    h: 130,
    hpMax: 80,
    hp: 80,
    phase: 1, // 1: Turrets Active, 2: Core Exposed
    turretTopHp: 20,
    turretBotHp: 20,
    pulseTimer: 0,

    update() {
        if (cameraX < 1920) return; // Wait until player reaches arena

        this.pulseTimer += 0.05;

        if (this.phase === 1) {
            if (this.turretTopHp <= 0 && this.turretBotHp <= 0) {
                this.phase = 2;
                createExplosion(this.x + 20, this.y + 30, '#ffb703', 30);
                AudioEngine.playExplosion();
            }

            // Boss Turret Attacks
            if (Math.random() < 0.02 && this.turretTopHp > 0) {
                enemyBullets.push({ x: this.x + 10, y: this.y + 20, vx: -3.5, vy: (Math.random() - 0.5) * 2 });
            }
            if (Math.random() < 0.02 && this.turretBotHp > 0) {
                enemyBullets.push({ x: this.x + 10, y: this.y + 100, vx: -3.5, vy: (Math.random() - 0.5) * 2 });
            }
        } else if (this.phase === 2) {
            // Core Aggressive Phase
            if (Math.random() < 0.05) {
                let ang = (Math.random() * 0.8 - 0.4) + Math.PI;
                enemyBullets.push({
                    x: this.x + 10,
                    y: this.y + 65,
                    vx: Math.cos(ang) * 4,
                    vy: Math.sin(ang) * 4
                });
            }
        }

        if (this.hp <= 0 && gameState !== 'VICTORY') {
            gameState = 'VICTORY';
            createExplosion(this.x + 40, this.y + 65, '#e63946', 60);
            AudioEngine.playExplosion();
        }
    },

    draw() {
        ctx.save();
        ctx.translate(this.x - cameraX, this.y);

        // Alien Base Structure
        ctx.fillStyle = '#2b2d42';
        ctx.fillRect(0, 0, this.w, this.h);

        if (this.phase === 1) {
            // Top Turret
            if (this.turretTopHp > 0) {
                ctx.fillStyle = '#8d99ae';
                ctx.fillRect(-10, 15, 20, 16);
            }
            // Bottom Turret
            if (this.turretBotHp > 0) {
                ctx.fillStyle = '#8d99ae';
                ctx.fillRect(-10, 95, 20, 16);
            }
        } else {
            // Glowing Alien Organ Core
            let pulse = Math.sin(this.pulseTimer) * 4;
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.arc(20, 65, 22 + pulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffb703';
            ctx.beginPath();
            ctx.arc(20, 65, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        // Health Bar Rendering
        ctx.fillStyle = '#000';
        ctx.fillRect(0, -15, this.w, 6);
        ctx.fillStyle = '#e63946';
        ctx.fillRect(0, -15, (this.w * (this.hp / this.hpMax)), 6);

        ctx.restore();
    }
};

// --- EXPLOSIONS & PARTICLES ---
const particles = [];
function createExplosion(x, y, color, count = 15) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            color: color,
            life: 25
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - cameraX, p.y, 3, 3);
    });
}

// --- COLLISION MANAGEMENT ENGINE ---
function handleCollisions() {
    // Player Bullets vs Enemies
    for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
        let b = bullets[bIdx];

        // Bullets vs Regular Enemies
        for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
            let e = enemies[eIdx];
            if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                e.hp--;
                bullets.splice(bIdx, 1);
                if (e.hp <= 0) {
                    createExplosion(e.x + e.w/2, e.y + e.h/2, '#e63946', 15);
                    AudioEngine.playExplosion();
                    enemies.splice(eIdx, 1);
                    score += 100;
                }
                break;
            }
        }

        // Bullets vs Falcon Pods
        for (let pIdx = falconPods.length - 1; pIdx >= 0; pIdx--) {
            let pod = falconPods[pIdx];
            if (b.x > pod.x && b.x < pod.x + pod.w && b.y > pod.y && b.y < pod.y + pod.h) {
                powerups.push(new Powerup(pod.x, pod.y, pod.weaponType));
                createExplosion(pod.x, pod.y, '#ffb703', 10);
                falconPods.splice(pIdx, 1);
                bullets.splice(bIdx, 1);
                break;
            }
        }

        // Bullets vs Boss
        if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
            bullets.splice(bIdx, 1);
            if (boss.phase === 1) {
                if (b.y < boss.y + 45 && boss.turretTopHp > 0) boss.turretTopHp--;
                if (b.y > boss.y + 85 && boss.turretBotHp > 0) boss.turretBotHp--;
            } else {
                boss.hp--;
                score += 50;
            }
            createExplosion(b.x, b.y, '#ffb703', 4);
        }
    }

    // Powerup Collection
    for (let pIdx = powerups.length - 1; pIdx >= 0; pIdx--) {
        let p = powerups[pIdx];
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y) {
            player.weapon = p.type;
            AudioEngine.playPowerup();
            powerups.splice(pIdx, 1);
            score += 500;
        }
    }

    // Enemy Bullets vs Player
    for (let ebIdx = enemyBullets.length - 1; ebIdx >= 0; ebIdx--) {
        let eb = enemyBullets[ebIdx];
        if (eb.x > player.x && eb.x < player.x + player.w && eb.y > player.y && eb.y < player.y + player.h) {
            enemyBullets.splice(ebIdx, 1);
            player.hit();
        }
    }

    // Direct Enemy Contact vs Player
    enemies.forEach(e => {
        if (player.x < e.x + e.w && player.x + player.w > e.x &&
            player.y < e.y + e.h && player.y + player.h > e.y) {
            player.hit();
        }
    });
}

// --- RENDERING PARALLAX BACKGROUND ---
function drawBackground() {
    // Sky gradient
    let grad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
    grad.addColorStop(0, '#0d1b2a');
    grad.addColorStop(1, '#1b263b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Distant Parallax Mountains
    ctx.fillStyle = '#0d1b2a';
    ctx.beginPath();
    ctx.moveTo(0, 180);
    for (let i = 0; i < CANVAS_WIDTH + 50; i += 40) {
        let mountainH = Math.sin((i + cameraX * 0.2) * 0.01) * 30 + 140;
        ctx.lineTo(i, mountainH);
    }
    ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT);
    ctx.lineTo(0, CANVAS_HEIGHT);
    ctx.fill();

    // Jungle Foliage Layer
    ctx.fillStyle = '#132a13';
    for (let x = -cameraX * 0.5 % 60; x < CANVAS_WIDTH; x += 60) {
        ctx.beginPath();
        ctx.arc(x, 190, 25, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawPlatforms() {
    platforms.forEach(p => {
        if (p.x + p.w > cameraX && p.x < cameraX + CANVAS_WIDTH) {
            // Top Grass Layer
            ctx.fillStyle = '#31572c';
            ctx.fillRect(p.x - cameraX, p.y, p.w, 4);
            // Earth Structure
            ctx.fillStyle = '#4f772d';
            ctx.fillRect(p.x - cameraX, p.y + 4, p.w, p.h - 4);
        }
    });
}

// --- HUD & HEADS UP DISPLAY ---
function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillText(`P1 SCORE: ${score}`, 15, 20);
    ctx.fillText(`LIVES: ${lives}`, 15, 35);
    ctx.fillText(`WEAPON: [${player.weapon}]`, 15, 50);
}

// --- MAIN GAME LOOP ---
function gameLoop() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    if (gameState === 'PLAYING') {
        // Updates
        player.update();
        boss.update();

        bullets.forEach((b, i) => {
            b.update();
            if (b.life <= 0 || b.x > cameraX + CANVAS_WIDTH) bullets.splice(i, 1);
        });

        enemyBullets.forEach((eb, i) => {
            eb.x += eb.vx;
            eb.y += eb.vy;
            if (eb.x < cameraX || eb.x > cameraX + CANVAS_WIDTH) enemyBullets.splice(i, 1);
        });

        falconPods.forEach(pod => pod.update());
        powerups.forEach(p => p.update());
        enemies.forEach(e => e.update());
        updateParticles();

        handleCollisions();

        // Rendering
        drawBackground();
        drawPlatforms();
        
        falconPods.forEach(pod => pod.draw());
        powerups.forEach(p => p.draw());
        enemies.forEach(e => e.draw());
        boss.draw();
        
        player.draw();
        bullets.forEach(b => b.draw());
        enemyBullets.forEach(eb => {
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.arc(eb.x - cameraX, eb.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
        drawParticles();
        drawHUD();

        // Reset single-frame key states
        KEYS.shootPressed = false;
        KEYS.jumpPressed = false;

    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = '#e63946';
        ctx.font = 'bold 28px "Courier New", monospace';
        ctx.fillText('GAME OVER', CANVAS_WIDTH / 2 - 80, CANVAS_HEIGHT / 2);
        ctx.fillStyle = '#fff';
        ctx.font = '14px "Courier New", monospace';
        ctx.fillText('PRESS FIRE OR JUMP TO RESTART', CANVAS_WIDTH / 2 - 130, CANVAS_HEIGHT / 2 + 30);

        if (KEYS.shoot || KEYS.jump) {
            lives = 3;
            score = 0;
            cameraX = 0;
            player.reset();
            boss.hp = boss.hpMax;
            boss.phase = 1;
            boss.turretTopHp = 20;
            boss.turretBotHp = 20;
            initEnemies();
            gameState = 'PLAYING';
        }
    } else if (gameState === 'VICTORY') {
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = '#ffb703';
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.fillText('MISSION ACCOMPLISHED', CANVAS_WIDTH / 2 - 140, CANVAS_HEIGHT / 2 - 10);
        ctx.fillStyle = '#fff';
        ctx.font = '14px "Courier New", monospace';
        ctx.fillText(`FINAL SCORE: ${score}`, CANVAS_WIDTH / 2 - 70, CANVAS_HEIGHT / 2 + 20);
    }

    requestAnimationFrame(gameLoop);
}

// Start Main Loop
requestAnimationFrame(gameLoop);

// Service Worker Registration for PWA Support
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        const swCode = `
            self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration bypass'));
    });
}
</script>
